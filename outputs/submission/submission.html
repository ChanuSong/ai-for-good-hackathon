<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SeoulMate · 제출용 핵심 기능</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1800px;height:1500px;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#17212e;background:#f5f7fc}.canvas{width:1800px;height:1500px;padding:66px 84px;background:radial-gradient(ellipse at 90% 0%,#e3eaff 0%,transparent 45%),linear-gradient(180deg,#fff 0%,#f3f6fd 65%,#edf2ff 100%)}header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:45px;font-weight:850;letter-spacing:-2.5px}.brand span{color:#375dfb}.tag{font-size:17px;font-weight:650;letter-spacing:2px;color:#637497;border:1px solid #d4dcef;border-radius:30px;padding:13px 23px}h1{font-size:61px;line-height:1.25;letter-spacing:-2.7px;margin:34px 0 14px;font-weight:800}h1 em{font-style:normal;color:#375dfb}.intro{margin:0;font-size:25px;letter-spacing:-.4px;color:#66748b;line-height:1.65}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:50px;margin-top:48px}.feature-heading{display:flex;align-items:center;gap:14px;margin-left:26px}.number{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:13px;background:#375dfb;color:white;font-size:19px;font-weight:750}h2{font-size:29px;letter-spacing:-.9px;margin:0;font-weight:750}.caption{font-size:20px;color:#62718b;margin:13px 0 26px 26px;line-height:1.5;letter-spacing:-.35px}.device{width:450px;margin:auto;background:#fff;padding:9px;border:1px solid #dce3f1;border-radius:34px;box-shadow:0 24px 50px #233c7914,0 3px 8px #233c7908;overflow:hidden}.device img{width:430px;height:900px;display:block;border-radius:25px}.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #d6dfef;margin-top:43px;padding-top:24px}.promise{font-size:22px;font-weight:650;letter-spacing:-.4px;color:#374765}.promise span{color:#375dfb;padding:0 15px}.note{text-align:right;font-size:16px;line-height:1.7;color:#73809b}
</style>
</head>
<body><main class="canvas">
<header><div class="brand">SeoulMate<span>.</span></div></header>
<h1>낯선 행정에서, <em>내가 할 수 있는 다음 행동으로.</em></h1>
<p class="intro">외국인 주민이 편한 언어로 이해하고, 필요한 준비를 확인하고, 생활행정을 시작하도록 돕습니다.</p>
<section class="features">
<article><div class="feature-heading"><span class="number">01</span><h2>내 언어로 묻고 이해하기</h2></div><p class="caption">다국어 질문 응답과 쉬운 행정 용어 설명</p><div class="device"><img src="chat.png" alt="일본어 이사 질문과 일본어 답변, 쉬운 행정 용어 설명을 보여주는 실제 채팅 화면"></div></article>
<article><div class="feature-heading"><span class="number">02</span><h2>지금 할 일을 하나씩</h2></div><p class="caption">상황별 기한 안내와 준비 체크리스트</p><div class="device"><img src="guide.png" alt="이사 후 주소 변경의 기한과 준비 체크리스트를 보여주는 실제 안내 화면"></div></article>
<article><div class="feature-heading"><span class="number">03</span><h2>공문에서 안내로 연결</h2></div><p class="caption">안내·언어를 선택하고 주민용 QR 생성</p><div class="device"><img src="qr.png" alt="일본어 이사 안내로 연결되는 QR을 생성한 실제 화면"></div></article>
</section>
<footer class="bottom"><div class="promise">질문<span>→</span>이해<span>→</span>준비<span>→</span>행동</div></footer>
</main></body>
</html>
