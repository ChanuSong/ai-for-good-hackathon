<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <title>SeoulMate · 생활행정</title>
    <link rel="stylesheet" href="./product.css" />
    <script type="module" src="./product.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 이동</a>
    <div id="app">
      <p class="loading" role="status">SeoulMate를 준비하고 있어요…</p>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
    <input
      id="document-camera"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />
    <input id="document-upload" type="file" accept="image/*" hidden />
    <noscript>이 목업을 이용하려면 JavaScript를 켜 주세요.</noscript>
  </body>
</html>
